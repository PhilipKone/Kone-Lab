    <!-- WebMCP Declarations for Autonomous Agentic Browsing -->
    <script type="application/webmcp+json">
    {
      "version": "1.0",
      "name": "Kone Lab Portal",
      "description": "Agent tools for hardware engineering, microcontroller simulators, and IoT prototyping",
      "tools": [
        {
          "name": "enroll_hardware_lab",
          "description": "Register for hardware prototyping, PCB design, and embedded IoT masterclasses",
          "parameters": {
            "type": "object",
            "properties": {
              "track": { 
                "type": "string", 
                "enum": ["Embedded Systems & IoT", "Arduino & Microcontrollers", "PCB Design", "3D CAD & Prototyping"] 
              },
              "studentEmail": { "type": "string", "format": "email" }
            },
            "required": ["track", "studentEmail"]
          }
        },
        {
          "name": "navigate_lab_mode",
          "description": "Switch between hardware workbench, 3D design studio, and telemetry dashboard",
          "parameters": {
            "type": "object",
            "properties": {
              "mode": { 
                "type": "string", 
                "enum": ["arduino", "3d-design", "portfolio", "curriculum"] 
              }
            },
            "required": ["mode"]
          }
        }
      ]
    }
    </script>

    <script>

                    console.log('SW registration failed: ', registrationError);

        }
    </script>
